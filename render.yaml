services:
  - type: web
    name: c2-server
    runtime: node
    buildCommand: ./render-build.sh
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User needs to set this manually
      - key: SESSION_SECRET
        generateValue: true # This will generate a random value
    # Make sure the node version is compatible
    buildFilter:
      paths:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.json"
        - "**/*.css"
        - "**/*.html"
      ignoredPaths:
        - "node_modules"

# You can either use Render's Postgres or your own Neon database
databases:
  - name: c2-server-db
    plan: starter
    ipAllowList: [] # Only allow internal connections by default